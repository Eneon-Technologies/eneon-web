<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Eneon Technologies — Content Admin</title>
  <link rel="icon" href="/images/brand/favicon-32.png" sizes="32x32" type="image/png">
  <!-- Absolute config path, so the admin also works when opened as /admin (no trailing slash). -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <!-- Login screen: show the Eneon logo at a sensible size, and stop Decap pulling the form up over
       it (it does that for its own wide logo), which made error messages overlap the logo. -->
  <style>
    [class*="CustomIconWrapper"] img { width: 88px !important; height: 88px !important; }
    form[class*="AuthForm"] { margin-top: 8px !important; }
  </style>
  <!-- Cloudinary upload widget (used by /admin/cms.js for photo and video uploads). -->
  <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <!-- Decap CMS, pinned so an upstream release can't change the admin unexpectedly. -->
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <script src="/admin/cms.js"></script>
</body>
</html>
