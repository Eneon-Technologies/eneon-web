<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Eneon Admin</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-sidebar>
      <a class="brand" href="#/">
        <img src="/static/eneon-mark.webp" width="36" height="36" alt="">
        <div><b>Eneon</b><span>Content admin</span></div>
      </a>
      <nav data-nav></nav>
      <div class="sidebar-footer">
        <b data-user-name></b>
        <span data-user-role></span>
        <div class="row">
          <a class="btn btn-ghost btn-small" href="#/account">My account</a>
          <button class="btn btn-ghost btn-small" type="button" data-logout>Sign out</button>
        </div>
      </div>
    </aside>
    <main class="main">
      <button class="btn btn-ghost btn-small menu-button" type="button" data-menu>☰ Menu</button>
      <div data-view><div class="loading"><div class="spinner"></div>Loading…</div></div>
    </main>
  </div>
  <div class="toast" data-toast hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
